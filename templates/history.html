<!DOCTYPE html>
<html>
<head>

    <title>Scan History</title>

    <link rel="stylesheet"
          href="{{ url_for(
          'static',
          filename='css/style.css'
          ) }}">

</head>

<body>

<div class="history-card">

    <h1>Scan History</h1>

    {% if history_data %}

    <table class="history-table">

        <thead>

            <tr>
                <th>Domain</th>
                <th>Score</th>
                <th>Risk Level</th>
            </tr>

        </thead>

        <tbody>

            {% for item in history_data %}

            <tr>

                <td>{{ item.domain }}</td>

                <td>{{ item.score }}</td>

                <td>

                    <span class="risk-badge {{ item.risk|lower }}">

                        {{ item.risk }}

                    </span>

                </td>

            </tr>

            {% endfor %}

        </tbody>

    </table>

    {% else %}

    <div class="empty-history">

        No scans found.

    </div>

    {% endif %}

    <a href="/clear-history"
       class="clear-btn">

        Clear History

    </a>

</div>

</body>
</html>
