<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard Analytics</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<div class="container">

    <h1>Dashboard Analytics</h1>

    <div class="stats-grid">

        <div class="card">

            <h3>Total Scans</h3>

            <h1>
                {{ analytics.total_scans }}
            </h1>

        </div>

        <div class="card">

            <h3>Average Score</h3>

            <h1>
                {{ analytics.avg_score }}
            </h1>

        </div>

    </div>

    <div class="card">

        <h3>Risk Distribution</h3>

        <canvas id="riskChart"></canvas>

    </div>

</div>


<script>

const riskData = {{ analytics.risk_data | tojson }};

const labels = riskData.map(item => item[0]);
const values = riskData.map(item => item[1]);

const ctx = document.getElementById("riskChart");

new Chart(ctx, {

    type: "pie",

    data: {

        labels: labels,

        datasets: [{

            data: values,

            backgroundColor: [
                "#22c55e",
                "#f59e0b",
                "#ef4444"
            ],

            borderWidth: 1

        }]

    },

    options: {

        responsive: true,

        plugins: {

            legend: {

                position: "bottom"

            }

        }

    }

});

</script>

</body>
</html>
